services:
  postgres:
    image: postgres:16.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - ps-store
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true

  game-catalog:
    build:
      context: ./game-catalog-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/catalog_db
      PORT: "8001"
      JWT_SECRET: ${JWT_SECRET:-ps-store-jwt-secret-key-change-in-production}
      ORDER_SERVICE_URL: http://order-service:8003
      USER_SERVICE_URL: http://user-service:8002
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ps-store
    ports:
      - "8001:8001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8001/health\")"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 50s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8002
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=user_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Secret: ${JWT_SECRET:-ps-store-jwt-secret-key-change-in-production}
      Jwt__Issuer: ${JWT_ISSUER:-ps-store}
      ServiceUrls__CatalogService: http://game-catalog:8001
      ServiceUrls__OrderService: http://order-service:8003
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ps-store
    ports:
      - "8002:8002"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 50s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/order_db
      PORT: "8003"
      JWT_SECRET: ${JWT_SECRET:-ps-store-jwt-secret-key-change-in-production}
      CATALOG_SERVICE_URL: http://game-catalog:8001
      USER_SERVICE_URL: http://user-service:8002
    depends_on:
      postgres:
        condition: service_healthy
      game-catalog:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - ps-store
    ports:
      - "8003:8003"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(\"http\").get(\"http://127.0.0.1:8003/health\",(r)=>{let e=r.statusCode===200?0:1;r.resume();process.exit(e);}).on(\"error\",()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 50s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_CATALOG_API: ${VITE_CATALOG_API:-http://localhost:8001}
        VITE_USER_API: ${VITE_USER_API:-http://localhost:8002}
        VITE_ORDER_API: ${VITE_ORDER_API:-http://localhost:8003}
    restart: unless-stopped
    depends_on:
      game-catalog:
        condition: service_healthy
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - ps-store
    ports:
      - "3000:80"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

networks:
  ps-store:
    driver: bridge

volumes:
  postgres_data:
