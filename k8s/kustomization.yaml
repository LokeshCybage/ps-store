apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ps-store

commonLabels:
  app.kubernetes.io/part-of: ps-store
  app.kubernetes.io/managed-by: kustomize

resources:
  - 00-namespace.yaml
  - 01-default-network-policies.yaml
  - 02-postgres.yaml
  - 03-game-catalog.yaml
  - 04-user-service.yaml
  - 05-order-service.yaml
  - 06-frontend.yaml

images:
  - name: ps-store/game-catalog
    newTag: "1.0.0"
  - name: ps-store/user-service
    newTag: "1.0.0"
  - name: ps-store/order-service
    newTag: "1.0.0"
  - name: ps-store/frontend
    newTag: "1.0.0"
