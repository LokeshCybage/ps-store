apiVersion: v1
kind: Namespace
metadata:
  name: ps-store
  labels:
    app.kubernetes.io/name: ps-store
    app.kubernetes.io/part-of: ps-store
    app.kubernetes.io/managed-by: kubectl
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    kubernetes.io/description: "PlayStation Store microservices (frontend + 3 backends + Postgres)"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ps-store-quota
  namespace: ps-store
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "12"
    limits.memory: 8Gi
    pods: "30"
    persistentvolumeclaims: "5"
    services: "10"
    services.loadbalancers: "1"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ps-store-limits
  namespace: ps-store
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 1Gi
      min:
        cpu: 50m
        memory: 32Mi
