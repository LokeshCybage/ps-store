trigger:
  branches:
    include: [main]
  paths:
    include:
      - user-service/*
      - user-service/**
      - .azure-pipelines/**
      - azure-pipelines-ci-user-service.yml
    exclude:
      - '**/*.md'

pr:
  branches:
    include: [main]
  paths:
    include:
      - user-service/*
      - user-service/**
      - .azure-pipelines/**
      - azure-pipelines-ci-user-service.yml
    exclude:
      - '**/*.md'

variables:
  - name: vmImage
    value: ubuntu-22.04
  - name: dotnetVersion
    value: '8.x'
  - name: imageRepository
    value: ps-store/user-service
  - name: imageTag
    value: $(Build.SourceVersion)

stages:
  - stage: CI
    displayName: CI
    jobs:
      - template: .azure-pipelines/templates/ci-docker-sonar.yml
        parameters:
          serviceName: user-service
          servicePath: user-service
          vmImage: $(vmImage)

          sonarServiceConnection: $(SONARQUBE_SERVICE_CONNECTION)
          sonarProjectKey: $(SONAR_USER_SERVICE_PROJECT_KEY)
          sonarProjectName: $(SONAR_USER_SERVICE_PROJECT_NAME)
          sonarSources: user-service
          sonarExtraProperties: |
            sonar.cs.opencover.reportsPaths=user-service/TestResults/**/coverage.opencover.xml

          acrServiceConnection: $(ACR_SERVICE_CONNECTION)
          imageRepository: $(imageRepository)
          imageTag: $(imageTag)
          dockerfile: user-service/Dockerfile
          buildContext: user-service

          testSteps:
            - task: UseDotNet@2
              displayName: Use .NET SDK $(dotnetVersion)
              inputs:
                version: $(dotnetVersion)

            - bash: |
                set -euo pipefail
                dotnet test UserService.Tests/UserService.Tests.csproj \
                  -c Release \
                  --logger trx \
                  --results-directory TestResults \
                  --collect:"XPlat Code Coverage" \
                  -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
              workingDirectory: user-service
              displayName: Run tests (dotnet) + coverage (opencover)

            - bash: |
                set -euo pipefail
                dotnet tool install --global dotnet-reportgenerator-globaltool
                export PATH="$PATH:$HOME/.dotnet/tools"

                mkdir -p CoverageReport
                reportgenerator \
                  "-reports:TestResults/**/coverage.opencover.xml" \
                  "-targetdir:CoverageReport" \
                  "-reporttypes:Cobertura"
              workingDirectory: user-service
              displayName: Convert coverage to Cobertura (for Azure DevOps)

            - template: .azure-pipelines/templates/steps-publish-test-coverage.yml
              parameters:
                testResultsFormat: VSTest
                testResultsFiles: user-service/TestResults/**/*.trx
                testRunTitle: user-service
                coverageTool: Cobertura
                coverageSummaryFile: user-service/CoverageReport/Cobertura.xml
                coverageReportDirectory: user-service/CoverageReport

            - bash: |
                set -euo pipefail
                mkdir -p pipeline
                cat > pipeline/image-info.json <<'EOF'
                {
                  "service": "user-service",
                  "repository": "$(imageRepository)",
                  "tag": "$(imageTag)"
                }
                EOF
              displayName: Write image metadata

            - task: PublishPipelineArtifact@1
              displayName: Publish image metadata
              inputs:
                targetPath: pipeline/image-info.json
                artifact: image-info-user-service

