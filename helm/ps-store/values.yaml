# Default values for ps-store.
# This file contains NO secrets. Provide sensitive values via:
# - pre-created Kubernetes Secrets (recommended), or
# - a separate gitignored values file passed via -f.

# Name overrides (optional)
nameOverride: ""
fullnameOverride: ""

# Global labels/annotations (optional)
commonLabels: {}
commonAnnotations: {}

# Image pull secrets (optional)
imagePullSecrets: []

# Namespace resources (optional; prefer `--create-namespace`)
namespace:
  create: false
  name: ps-store
  podSecurity:
    enforce: restricted
    warn: restricted
    audit: restricted

# Default-deny NetworkPolicies (recommended when your CNI supports it)
networkPolicy:
  enabled: true

# Ingress for the UI and API routing
ingress:
  enabled: true
  className: nginx
  host: ps-store.local
  tls:
    enabled: false
    secretName: ps-store-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"

# Postgres (StatefulSet)
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16.6-bookworm"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: "" # empty means cluster default
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }
  # Secret containing POSTGRES_USER and POSTGRES_PASSWORD
  credentialsSecret:
    name: postgres-credentials
    userKey: POSTGRES_USER
    passwordKey: POSTGRES_PASSWORD
  databases:
    - catalog_db
    - user_db
    - order_db

# Game Catalog (Python/FastAPI) — port 8001
gameCatalogService:
  enabled: true
  replicaCount: 2
  image:
    repository: ps-store/game-catalog
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8001
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  config:
    otelServiceName: game-catalog-service
    otelZipkinEndpoint: http://zipkin.observability.svc.cluster.local:9411/api/v2/spans
    orderServiceUrl: http://order-service:8003
    userServiceUrl: http://user-service:8002
  existingSecret:
    name: game-catalog
    databaseUrlKey: DATABASE_URL
    jwtSecretKey: JWT_SECRET
  env: []

# User Service (.NET 8) — port 8002
userService:
  enabled: true
  replicaCount: 2
  image:
    repository: ps-store/user-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8002
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  config:
    jwtIssuer: ps-store
    catalogServiceUrl: http://game-catalog:8001
    orderServiceUrl: http://order-service:8003
    otelServiceName: user-service
    otelZipkinEndpoint: http://zipkin.observability.svc.cluster.local:9411/api/v2/spans
    zipkinEndpoint: http://zipkin.observability.svc.cluster.local:9411/api/v2/spans
  existingSecret:
    name: user-service
    connectionStringKey: ConnectionStrings__DefaultConnection
    jwtSecretKey: Jwt__Secret
  env: []

# Order Service (Node.js/Express) — port 8003
orderService:
  enabled: true
  replicaCount: 2
  image:
    repository: ps-store/order-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8003
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  config:
    nodeEnv: production
    catalogServiceUrl: http://game-catalog:8001
    userServiceUrl: http://user-service:8002
    otelServiceName: order-service
    otelZipkinEndpoint: http://zipkin.observability.svc.cluster.local:9411/api/v2/spans
  existingSecret:
    name: order-service
    databaseUrlKey: DATABASE_URL
    jwtSecretKey: JWT_SECRET
  env: []

# Frontend (React/Nginx) — service port 80
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: ps-store/frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "250m", memory: "128Mi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
