{{- /*
Secrets rendered from values.yaml for demo convenience.

PRODUCTION: replace this template with SOPS-encrypted secrets, Sealed Secrets,
or an ExternalSecret pointing at Vault / AWS Secrets Manager / Azure Key Vault.
*/ -}}
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels: {{- include "ps-store.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
---
{{- end }}
{{- if .Values.gameCatalogService.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: game-catalog-secrets
  labels: {{- include "ps-store.labels" (dict "ctx" . "component" "game-catalog-service") | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "ps-store.pgUri" (dict "ctx" . "db" .Values.gameCatalogService.database) | quote }}
  JWT_SECRET: {{ .Values.jwt.secret | quote }}
---
{{- end }}
{{- if .Values.userService.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: user-service-secrets
  labels: {{- include "ps-store.labels" (dict "ctx" . "component" "user-service") | nindent 4 }}
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: {{ include "ps-store.pgDotnet" (dict "ctx" . "db" .Values.userService.database) | quote }}
  Jwt__Secret: {{ .Values.jwt.secret | quote }}
---
{{- end }}
{{- if .Values.orderService.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secrets
  labels: {{- include "ps-store.labels" (dict "ctx" . "component" "order-service") | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "ps-store.pgUri" (dict "ctx" . "db" .Values.orderService.database) | quote }}
  JWT_SECRET: {{ .Values.jwt.secret | quote }}
{{- end }}
