{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  labels: {{- include "ps-store.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels: {{- include "ps-store.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
immutable: true
data:
  01-databases.sql: |
    {{- range .Values.postgres.databases }}
    CREATE DATABASE {{ . }};
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "ps-store.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  annotations:
    kubernetes.io/description: "Headless service backing the postgres StatefulSet (stable DNS)."
spec:
  clusterIP: None
  selector: {{- include "ps-store.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "ps-store.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  annotations:
    kubernetes.io/description: "Postgres backing store for all services."
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {{- include "ps-store.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ps-store.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 8 }}
      annotations:
        {{- include "ps-store.podAnnotations" (dict "ctx" . "config" (toYaml .Values.postgres)) | nindent 8 }}
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      {{- include "ps-store.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ include "ps-store.image" (dict "ctx" . "img" .Values.postgres.image) | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgres.credentialsSecret.name is required" .Values.postgres.credentialsSecret.name | quote }}
                  key: {{ .Values.postgres.credentialsSecret.userKey | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgres.credentialsSecret.name is required" .Values.postgres.credentialsSecret.name | quote }}
                  key: {{ .Values.postgres.credentialsSecret.passwordKey | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          startupProbe:
            exec: { command: ["pg_isready","-U","postgres"] }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec: { command: ["pg_isready","-U","postgres"] }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: { command: ["pg_isready","-U","postgres"] }
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init
            defaultMode: 0444
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: run
          emptyDir: { sizeLimit: 64Mi }
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "ps-store.labels" (dict "ctx" . "component" "postgres") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ .Values.postgres.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size | quote }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  labels: {{- include "ps-store.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  annotations:
    kubernetes.io/description: "Only backend services may connect to Postgres."
spec:
  podSelector:
    matchLabels: {{- include "ps-store.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  policyTypes: ["Ingress","Egress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["game-catalog","user-service","order-service"]
      ports:
        - protocol: TCP
          port: 5432
  egress: []
{{- end }}
