apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ps-store.fullname" . }}-test-connection"
  labels: {{- include "ps-store.labels" (dict "ctx" . "component" "test") | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: wget
      image: busybox:1.36.1
      command: ["sh","-c"]
      args:
        - >-
          wget -q -O- http://frontend:{{ .Values.frontend.service.port }}/ >/dev/null
          && wget -q -O- http://game-catalog:{{ .Values.gameCatalogService.service.port }}/health >/dev/null
          && wget -q -O- http://user-service:{{ .Values.userService.service.port }}/health >/dev/null
          && wget -q -O- http://order-service:{{ .Values.orderService.service.port }}/health >/dev/null
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
