{{- if and .Values.ingress.enabled .Values.frontend.enabled }}
---
# API routes: regex + rewrite-target must NOT apply to /assets/* or the SPA returns index.html for JS/CSS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ps-store.fullname" . }}-api
  labels: {{- include "ps-store.labels" (dict "ctx" . "component" "ingress") | nindent 4 }}
  annotations:
    kubernetes.io/description: "Rewrites /api/<svc>/* to each microservice (see rewrite-target)."
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tls.secretName is required when tls.enabled=true" .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /api/catalog(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: game-catalog
                port:
                  number: {{ .Values.gameCatalogService.service.port }}
          - path: /api/users(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-service
                port:
                  number: {{ .Values.userService.service.port }}
          - path: /api/orders(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: order-service
                port:
                  number: {{ .Values.orderService.service.port }}
---
# Frontend + static files: no rewrite-target (otherwise /assets/*.js becomes / and breaks the SPA).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ps-store.fullname" . }}-web
  labels: {{- include "ps-store.labels" (dict "ctx" . "component" "ingress") | nindent 4 }}
  annotations:
    kubernetes.io/description: "Serves SPA HTML and /assets/* without path rewriting."
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tls.secretName is required when tls.enabled=true" .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
