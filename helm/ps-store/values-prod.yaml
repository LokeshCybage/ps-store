# Production overrides for ps-store. Only deltas from values.yaml.
# Pin image tags here to release digests in real deployments.

global:
  imageRegistry: ""
  otel:
    zipkinEndpoint: "http://zipkin.observability.svc.cluster.local:9411/api/v2/spans"

gameCatalogService:
  replicaCount: 3
  image:
    tag: "1.0.0"
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits:   { cpu: "1",    memory: "512Mi" }

userService:
  replicaCount: 3
  image:
    tag: "1.0.0"
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits:   { cpu: "1",    memory: "512Mi" }

orderService:
  replicaCount: 3
  image:
    tag: "1.0.0"
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits:   { cpu: "1",    memory: "512Mi" }

frontend:
  replicaCount: 3
  image:
    tag: "1.0.0"

postgres:
  # In production prefer a managed DB — disable the in-chart StatefulSet and
  # point services at the external host via postgres.external.host.
  enabled: true
  persistence:
    size: 20Gi
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "2",    memory: "2Gi" }

ingress:
  host: store.example.com
  tls:
    enabled: true
    secretName: ps-store-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
