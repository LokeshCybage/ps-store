trigger:
  branches:
    include: [main]
  paths:
    include:
      - frontend/*
      - frontend/**
      - .azure-pipelines/**
      - azure-pipelines-ci-frontend.yml
    exclude:
      - '**/*.md'

pr:
  branches:
    include: [main]
  paths:
    include:
      - frontend/*
      - frontend/**
      - .azure-pipelines/**
      - azure-pipelines-ci-frontend.yml
    exclude:
      - '**/*.md'

variables:
  - name: vmImage
    value: ubuntu-22.04
  - name: nodeVersion
    value: '20.x'
  - name: imageRepository
    value: ps-store/frontend
  - name: imageTag
    value: $(Build.SourceVersion)

stages:
  - stage: CI
    displayName: CI
    jobs:
      - template: .azure-pipelines/templates/ci-docker-sonar.yml
        parameters:
          serviceName: frontend
          servicePath: frontend
          vmImage: $(vmImage)

          sonarServiceConnection: $(SONARQUBE_SERVICE_CONNECTION)
          sonarProjectKey: $(SONAR_FRONTEND_PROJECT_KEY)
          sonarProjectName: $(SONAR_FRONTEND_PROJECT_NAME)
          sonarSources: frontend/src
          sonarExtraProperties: |
            sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

          acrServiceConnection: $(ACR_SERVICE_CONNECTION)
          imageRepository: $(imageRepository)
          imageTag: $(imageTag)
          dockerfile: frontend/Dockerfile
          buildContext: frontend

          testSteps:
            - task: NodeTool@0
              displayName: Use Node $(nodeVersion)
              inputs:
                versionSpec: $(nodeVersion)

            - bash: |
                set -euo pipefail
                npm ci
              workingDirectory: frontend
              displayName: Install dependencies

            - bash: |
                set -euo pipefail
                npm run test:coverage
              workingDirectory: frontend
              displayName: Run tests (vitest) + coverage

            - template: .azure-pipelines/templates/steps-publish-test-coverage.yml
              parameters:
                testResultsFormat: JUnit
                testResultsFiles: frontend/test-results.xml
                testRunTitle: frontend
                coverageTool: Cobertura
                coverageSummaryFile: frontend/coverage/cobertura-coverage.xml
                coverageReportDirectory: frontend/coverage

            - bash: |
                set -euo pipefail
                mkdir -p pipeline
                cat > pipeline/image-info.json <<'EOF'
                {
                  "service": "frontend",
                  "repository": "$(imageRepository)",
                  "tag": "$(imageTag)"
                }
                EOF
              displayName: Write image metadata

            - task: PublishPipelineArtifact@1
              displayName: Publish image metadata
              inputs:
                targetPath: pipeline/image-info.json
                artifact: image-info-frontend

